name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk DroidLink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DroidLink-apk
          path: DroidLink.apk

      # A release makes the APK easy to download straight onto a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" DroidLink.apk --title "DroidLink build ${{ github.run_number }}" --notes "Built from ${{ github.sha }}"
